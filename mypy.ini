# Deliberately lenient, unlike the other Kontell add-ons.
#
# This is a fork of an untyped 2900-line upstream codebase, not something
# written here. Turning on `disallow_untyped_defs` would demand annotations on
# every upstream function and bury the changes that matter under a few thousand
# lines of churn. What is enabled below is the set of checks that find real
# defects without requiring a single annotation.
#
# Be clear about what this buys: on an unannotated codebase mypy infers almost
# nothing, so it passes clean today and is a *regression guard*, not a
# bug-finder. It did not, for instance, catch the UnboundLocalError in
# helper.date_year() — neither the settings below nor the opt-in
# `possibly-undefined` code reports it. That one was found by reading.
#
# The intent is to ratchet: as a module gets annotated here it can be added to
# a strict per-module override, and mypy starts earning more.

[mypy]
python_version = 3.10
files = resources/lib, default.py, plugin.py, service.py
# The add-on ships as a top-level package directory, so `resources.lib.x`
# imports only resolve with the repo root on the path.
mypy_path = .
no_implicit_optional = True
warn_redundant_casts = True
warn_unreachable = True
strict_equality = True
# Upstream leans on star-imports (`from resources.lib.helper import *`), which
# mypy follows fine, but the re-exports are not declared via __all__.
implicit_reexport = True

# Kodistubs has full annotations but ships no py.typed marker.
[mypy-xbmc,xbmcaddon,xbmcgui,xbmcplugin,xbmcvfs]
follow_untyped_imports = True

# Third-party add-on modules resolved by Kodi at runtime, absent from CI.
[mypy-simplecache,arrow,routing]
ignore_missing_imports = True
